<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zerzura · authorised is not the same as allowed</title>
<style>
:root{
  --ink:#191c20; --muted:#59626e; --faint:#8b94a1; --rule:#e3e7eb;
  --bg:#fbfcfd; --panel:#fff; --code:#f3f6f8;
  --no:#a8324a; --yes:#1d6b45; --accent:#2f5d8a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad:clamp(20px,4vw,52px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#e8ebef; --muted:#9aa4b2; --faint:#6e7987; --rule:#292f37;
  --bg:#13161a; --panel:#1a1e23; --code:#101317;
  --no:#e88099; --yes:#6cc292; --accent:#8fb6dd;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.stage{height:100dvh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* progress */
.top{flex:none;display:flex;align-items:center;gap:14px;padding:14px var(--pad) 0}
.brand{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.dots{display:flex;gap:6px;flex:1;align-items:center}
.dot{height:3px;flex:1;background:var(--rule);border:0;padding:0;border-radius:2px;
  cursor:pointer;position:relative;overflow:hidden;min-width:8px}
.dot[aria-current=true]{background:color-mix(in srgb,var(--accent) 30%,var(--rule))}
.dot .fill{position:absolute;inset:0;width:0;background:var(--accent);border-radius:2px}
.dot[data-done=true]{background:color-mix(in srgb,var(--accent) 55%,var(--rule))}

/* slides */
.deck{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:clamp(14px,3vh,34px) var(--pad) 0;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.slide.on{opacity:1;pointer-events:auto;transform:none}
@media (prefers-reduced-motion:reduce){.slide{transition:none;transform:none}}
.eyebrow{flex:none;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-bottom:12px}
h1{flex:none;font-size:clamp(26px,4.4vw,40px);line-height:1.14;letter-spacing:-.02em;
  margin:0 0 12px;font-weight:650;max-width:34ch}
h2{flex:none;font-size:clamp(20px,2.9vw,29px);line-height:1.2;letter-spacing:-.015em;
  margin:0 0 8px;font-weight:640;max-width:30ch}
.sub{flex:none;color:var(--muted);margin:0 0 clamp(12px,2.2vh,22px);max-width:62ch;
  font-size:clamp(14.5px,1.7vw,17px)}
.body{flex:1;min-height:0;overflow:auto;padding-bottom:18px;scrollbar-width:thin}

/* pieces */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.5vw,14.5px)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font:600 10.5px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.off{color:var(--faint)}
td.hide{color:var(--no);font-family:var(--mono);font-size:.9em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,18px);align-items:start}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.tag{display:inline-block;font:600 10px/1.9 var(--mono);letter-spacing:.07em;text-transform:uppercase;
  padding:0 8px;border-radius:4px;background:var(--code);color:var(--faint);border:1px solid var(--rule)}
.tag.no{color:var(--no);border-color:color-mix(in srgb,var(--no) 30%,var(--rule))}
.tag.yes{color:var(--yes);border-color:color-mix(in srgb,var(--yes) 30%,var(--rule))}
.head{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-bottom:1px solid var(--rule);
  flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.head b{color:var(--ink);font-family:var(--mono);font-size:15px;font-weight:650}
.note{font-size:clamp(13px,1.5vw,14.5px);color:var(--muted);margin:12px 0 0;max-width:70ch}
code{font-family:var(--mono);font-size:.9em;background:var(--code);padding:1px 5px;border-radius:4px}
pre{margin:0;padding:12px;background:var(--code);overflow:auto;font-family:var(--mono);
  font-size:11.5px;line-height:1.55;max-height:30vh}
ul.plain{margin:0;padding-left:1.1em}
ul.plain li{margin:9px 0;color:var(--muted);font-size:clamp(13.5px,1.6vw,15.5px)}
ul.plain b{color:var(--ink);font-weight:600}
a{color:var(--accent)}

/* walkthrough */
.exchange{border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
.exchange .bar{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--rule)}
.exchange .t{font-weight:600;font-size:clamp(14.5px,1.8vw,17px)}
.exchange .w{color:var(--muted);font-size:13.5px;margin-top:3px;max-width:64ch}
.exchange .m{font-family:var(--mono);font-size:12px;color:var(--no);margin-top:7px;line-height:1.5}
.pill{flex:none;margin-top:2px;font:600 10px/1.8 var(--mono);letter-spacing:.08em;
  padding:0 9px;border-radius:99px;text-transform:uppercase}
.pill.no{background:color-mix(in srgb,var(--no) 14%,transparent);color:var(--no)}
.pill.yes{background:color-mix(in srgb,var(--yes) 16%,transparent);color:var(--yes)}
.ticks{display:flex;gap:5px;margin:0 0 12px;flex-wrap:wrap}
.tick{width:22px;height:4px;border-radius:2px;background:var(--rule);border:0;padding:0;cursor:pointer}
.tick.no{background:color-mix(in srgb,var(--no) 45%,var(--rule))}
.tick.yes{background:color-mix(in srgb,var(--yes) 50%,var(--rule))}
.tick[aria-current=true]{outline:2px solid var(--accent);outline-offset:2px}

/* arithmetic */
.arith{font-family:var(--mono);font-size:clamp(17px,3.6vw,26px);padding:clamp(14px,3vh,26px) 12px;
  text-align:center;font-variant-numeric:tabular-nums;line-height:1.35}
.arith .r{color:var(--no);font-weight:650}

/* controls */
.bottom{flex:none;display:flex;align-items:center;gap:10px;padding:10px var(--pad) 16px;
  border-top:1px solid var(--rule);font-size:13px;color:var(--muted);flex-wrap:wrap}
button.ctl{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--rule);
  border-radius:7px;padding:5px 12px;cursor:pointer}
button.ctl:hover{background:var(--code)}
.spacer{flex:1}
.hint{font-size:12px;color:var(--faint)}
@media(max-width:600px){.hint{display:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <span class="brand">Zerzura</span>
    <div class="dots" id="dots"></div>
  </div>
  <div class="deck" id="deck"></div>
  <div class="bottom">
    <button class="ctl" id="prev" aria-label="Previous">&larr;</button>
    <button class="ctl" id="play">Pause</button>
    <button class="ctl" id="next" aria-label="Next">&rarr;</button>
    <span id="where" class="hint"></span>
    <span class="spacer"></span>
    <span class="hint">&larr; &rarr; to move · space to pause</span>
    <a class="hint" id="src" href="https://github.com/micheldumontier/zerzura">source</a>
  </div>
</div>
<script src="./demo.js"></script>
</body>
</html>
